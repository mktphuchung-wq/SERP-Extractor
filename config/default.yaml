# Auto SERP Research Collector - cau hinh mac dinh
# KHONG luu password / cookie / token trong file nay.

browser:
  # Engine dieu khien trinh duyet.
  #
  # bridge (mac dinh, kien truc V2)
  #   Mo tab NGAY TRONG cua so Chrome ma ban dang dung. Khong khoi dong tien
  #   trinh trinh duyet nao. Nho vay phien dang nhap Google/Ahrefs va cac
  #   extension ban da cai deu dung duoc ngay - khong phai dang nhap lai.
  #   Dieu khien bang chrome.debugger thong qua extension trong thu muc
  #   extension\ (cai mot lan bang Load unpacked).
  #   Chrome se hien thanh vang "Extension ... dang go loi trinh duyet nay"
  #   tren tab dang lam viec. Do la co che bao ve cua Chrome, khong tat duoc.
  #
  # playwright (kien truc V1)
  #   Khoi dong Chrome for Testing rieng voi profile rieng. Khong dung duoc
  #   phien dang nhap cua ban, nhung chay duoc khi khong co ai ngoi truoc may.
  #
  # Cac khoa browser.* con lai o duoi CHI ap dung cho engine playwright.
  engine: bridge

  # auto    : uu tien Chrome for Testing trong runtime\chrome, thieu thi dung Chrome he thong
  # bundled : bat buoc Chrome for Testing (bao loi neu chua tai) - dung khi muon chac chan
  #           3 extension trong vendor\extensions duoc nap
  # system  : bat buoc Chrome he thong (LUU Y: ban chinh thuc bo qua --load-extension
  #           nen phai tu cai extension vao profile automation)
  # hoac mot duong dan tuyet doi toi chrome.exe
  chrome_path: auto
  user_data_dir: '%LOCALAPPDATA%\AutoSerpTool\chrome-profile'
  remote_debugging_port: 9222
  # Tinh nang cua Chrome bi tat vi no cuop lay dieu huong cua trang web.
  #
  # Boi canh: tu Chrome 152, khi SERP di sang AI Mode (udm=50), Chrome KHONG tai
  # trang do trong tab nua. No mo giao dien noi bo chrome://contextual-tasks/ roi
  # nhet trang google.com that vao trong mot <webview>. Nguoi dung van doc duoc
  # cau tra loi, nhung Playwright bam vao tab ben ngoai nen doc ra 0 ky tu ->
  # AI_RESPONSE_TIMEOUT va muc "AI Mode" rong du man hinh hien day du.
  #
  # DA THU VA CHUA AN THUA: tat hai co duoi day KHONG chan duoc chuyen huong tren
  # Chrome for Testing 152.0.7977.54 - tab van thanh chrome://contextual-tasks/.
  # Giu lai vi vo hai va co the co tac dung o phien ban khac. Cach sua thuc su phai
  # doc noi dung tu chinh target "webview" qua CDP; Playwright khong expose target
  # kieu do thanh page.
  disable_features:
    - ContextualTasks_Srp2Aim
    - ContextualTasksDesktop
  # Xac minh Chrome dang attach dung la profile automation (khong phai profile ca nhan).
  # Chi tat khi ban thuc su hieu minh dang lam gi.
  verify_profile: true
  headless: false                        # AI Mode / extension can UI that
  launch_timeout_ms: 45000
  viewport:
    width: 1440
    height: 1000

# Cau noi giua tool va extension trong trinh duyet (chi dung cho engine bridge).
bridge:
  # 0 = de he dieu hanh chon mot cong trong. Chi bind 127.0.0.1, khong bao gio
  # nhan ket noi tu may khac. Moi lan chay dung mot token ngau nhien rieng.
  port: 0
  # Thoi gian cho nguoi dung cai/bat extension roi ghep noi.
  pair_timeout_ms: 120000
  # Thoi gian cho mot lenh CDP tra ve.
  call_timeout_ms: 30000
  # Khi extension/service worker rot WebSocket giua run, cho no tu noi lai truoc
  # khi ket luan bridge hong. Khong ap dung cho lan ghep noi dau tien.
  reconnect_timeout_ms: 10000

search:
  scheme: 'https'                       # chi doi khi test cuc bo
  domain: 'www.google.com'
  country: 'us'
  language: 'en'
  personalization: false                 # false -> pws=0
  results_per_page: 10
  pages: 2
  min_delay_ms: 1800
  max_delay_ms: 3500
  page_timeout_ms: 45000

ai:
  open_overview_first: true
  direct_ai_mode_fallback: true
  overview_timeout_ms: 15000
  # Tran tren tuyet doi khi da QUAN SAT duoc tien trien (response dang dai them
  # hoac loading marker hop le trong dung khoi AI).
  response_timeout_ms: 90000
  stable_ms: 2500
  min_response_chars: 40
  poll_interval_ms: 750
  # --- Ngan sach chong "cho mu" (dac ta Fast Path v1 - P0) --------------------
  # Run 20260827-171404: prompt duoc coi la "da gui" nho mot marker aria-busy o
  # ngoai khoi AI, roi tool cho du 120 giay ma khong bao gio co response nao.
  #
  # confirm_submit_ms  : toi da de xac nhan prompt THAT SU duoc nhan.
  # no_progress_ms     : o nhap da trong nhung khong co loading/response -> bo som.
  # answer_budget_ms   : chua tung thay tien trien nao -> ket thuc AI trong khoang nay.
  submit_confirm_ms: 8000
  # Prompt van con nguyen sau thoi gian nay: su kien gui da bi mat, retry som.
  submit_grace_ms: 2500
  submit_no_progress_ms: 5000
  answer_budget_ms: 30000
  submit_retries: 1
  # Sau khi bam Copy, cho bay nhieu lau de clipboard doi so voi noi dung TRUOC
  # do. Khong doi -> coi nhu that bai, khong lay noi dung cu cua buoc Ahrefs.
  clipboard_timeout_ms: 5000
  clipboard_poll_ms: 300
  prompt_template: 'Analyze the search topic "{{keyword}}" and explain the main intent, key subtopics, and important distinctions.'

extractors:
  keyword_ideas_source: 'ahrefs'
  allow_keyword_ideas_fallback: false
  paa_capture_mode: 'questions_only'     # questions_only | questions_and_answers
  suggestion_source: 'extension_then_dom'
  # Loai goi y lay tu lich su tim kiem cua tai khoan (dong co nut Delete).
  # Do la du lieu ca nhan, khong phai Google Search Suggestion, va nguoc voi pws=0.
  exclude_personalized_suggestions: true
  serp_source: 'extension_then_dom'
  normalize_serp_csv: false
  # v2.0: bat mac dinh - dropdown DOM khong phai luc nao cung mo duoc,
  # endpoint nay la nguon du phong re va on dinh.
  allow_autocomplete_endpoint: true
  # DEADLINE TONG cho mot lan tim widget Ahrefs (khong phai ngan sach cua rieng
  # selector dau tien - xem firstVisible trong src/browser/locator.mjs).
  # Muc tieu Fast Path v1: moi lan tim container khong qua 5-8 giay. Lan thu hai
  # tro di gan nhu tuc thi vi selector da thang duoc ghi nho trong run.
  ahrefs_timeout_ms: 8000
  extension_timeout_ms: 20000
  download_timeout_ms: 30000

output:
  root: './output'
  logs_root: './logs'
  encoding: 'utf8'
  on_conflict: 'timestamp'               # timestamp | fail | overwrite
  max_filename_length: 120

recovery:
  retries_per_step: 2
  backoff_ms: [2000, 5000]
  save_screenshot_on_error: true
  save_trace_on_error: true
  pause_for_manual_login: true
  pause_for_manual_captcha: true
  manual_pause_timeout_ms: 600000

notifications:
  console: true
  sound: true
  windows_toast: true
  open_result: true                      # mo file .md bang Notepad ngay khi chay xong
  open_result_with: 'notepad.exe'
  open_batch_summary: true               # khi chay nhieu tu khoa: mo file tong ket

performance:
  # Workflow trong mot keyword luon theo thu tu Suggestions -> Ahrefs -> 2 CSV
  # -> AI Overview de tranh tranh chap focus/clipboard va DOM thay doi.
  parallel_steps: false
  stagger_ms: 1200                       # giu de tuong thich config cu
  # Nhieu tu khoa (ngan cach bang ";") LUON chay tuan tu tren cung mot profile
  # vi Google va extension phu thuoc trang thai tab/profile (dac ta muc 17).
  keyword_concurrency: 1

capture:
  enabled: false                         # bat bang --capture-dom
  blocks: []                             # rong = tat ca block co selector
  include_shadow: true                   # serialize ca noi dung shadow root
  max_html_bytes: 4000000

logging:
  # Bat len thi SELECTOR_DRIFT tu INFO thanh WARN (dung khi muon CI gat).
  strict_selectors: false
  selector_stale_days: 90

privacy:
  redact_logs: true
  # Chi kiem tra TEN THU MUC extension trong Chrome ca nhan de canh bao
  # "da cai nham profile". Khong doc cookie/lich su, khong dung profile do de chay.
  hint_personal_chrome: true

# detect  : cach xac minh extension
#   widget - thay truc tiep tren SERP (Ahrefs Toolbar). Probe trang
#            chrome-extension:// chi de tham khao; khong doc duoc thi de
#            "unknown" roi cho widget tra loi thay - KHONG bao chua cai.
#   popup  - phai mo duoc popup/options page moi dung duoc.
#   none   - khong tham gia workflow tu dong: khong probe, khong canh bao.
# required: true moi duoc phep lam hong run khi chay voi --require-extensions.
extensions:
  ahrefs:
    id: 'hgmoccdbjhknikckedaaebbpdeebhiei'
    name: 'Ahrefs SEO Toolbar'
    webstore: 'https://chromewebstore.google.com/detail/ahrefs-seo-toolbar/hgmoccdbjhknikckedaaebbpdeebhiei'
    detect: widget
    required: false
  serp_export:
    id: 'oijhomofkbpbjldkdhkkjkcdokdigeie'
    name: 'SEO SERP Extraction Tool'
    webstore: 'https://chromewebstore.google.com/detail/seo-serp-extraction-tool/oijhomofkbpbjldkdhkkjkcdokdigeie'
    # Optional: khong kich hoat duoc thi native SERP extractor lam nguon chinh
    # ngay tu dau (dac ta Fast Path v1 - P0).
    detect: popup
    required: false
  suggestions:
    id: 'lbgklcfhclfdeapdabmcphhkomkofbga'
    name: 'Google Search Suggestion Extractor'
    webstore: 'https://chromewebstore.google.com/detail/google-search-suggestion/lbgklcfhclfdeapdabmcphhkomkofbga'
    # Da bi loai khoi luong tu dong tu v2.0: adapter dung DOM dropdown +
    # endpoint autocomplete. Khong probe, khong canh bao nhu dependency.
    detect: none
    required: false
