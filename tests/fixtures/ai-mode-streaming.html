<!-- Fixture: dung luong thao tac that tren SERP: Show more -> Paste Prompt -> Load -> Copy. -->
<html>
<body>
  <div id="search">
    <div id="rso">
      <div data-attrid="AIOverviewBlock">
        <div role="heading" aria-level="2">AI Overview</div>
        <div class="ai-body"><p>Short AI Overview text before expanding.</p></div>
        <button aria-label="Copy text" id="old-overview-copy"></button>
        <div role="button" aria-label="Show more AI Overview" aria-expanded="false" id="showmore">Show more</div>
        <div class="ai-follow-up" hidden>
          <textarea aria-label="Paste Prompt" id="promptbox"></textarea>
          <button aria-label="Load" id="load">Load</button>
        </div>
        <div id="responses"></div>
      </div>
    </div>
  </div>

  <script>
    var CHUNKS = [
      '<h3>Main similarities</h3>',
      '<p>Both peoples share <strong>Austronesian</strong> ancestry.</p>',
      '<ul><li>Related language families</li><li>Island geography</li></ul>',
      '<p>Read <a href="https://source.example.com/study">this study</a>.</p>'
    ];

    var showMoreClicks = 0;
    document.getElementById('old-overview-copy').addEventListener('click', function () {
      window.__copiedText = 'Short AI Overview text before expanding.';
    });
    document.getElementById('showmore').addEventListener('click', function () {
      showMoreClicks += 1;
      // Mo phong node Google doi/stale o click dau: adapter phai xac minh va thu lai.
      if (showMoreClicks === 1) return;
      this.setAttribute('aria-expanded', 'true');
      document.querySelector('.ai-follow-up').hidden = false;
      document.querySelector('.ai-body').innerHTML += '<p>Expanded extra overview paragraph.</p>';
    });

    document.getElementById('load').addEventListener('click', function () {
      // Google thay ca subtree AI Overview sau khi submit. Dat response moi
      // ngoai container cu de hoi quy viec khong duoc tiep tuc tim Copy trong
      // locator Overview da cu/stale.
      var oldHost = document.getElementById('responses');
      var host = document.createElement('div');
      host.id = 'responses-after-load';
      oldHost.remove();
      document.body.appendChild(host);
      var promptCopy = document.createElement('button');
      promptCopy.setAttribute('aria-label', 'Copy What are the main similarities and differences?');
      promptCopy.addEventListener('click', function () {
        window.__copiedText = 'What are the main similarities and differences?';
      });
      host.appendChild(promptCopy);
      var block = document.createElement('div');
      block.setAttribute('data-rp-response', '1');
      host.appendChild(block);

      var spinner = document.createElement('div');
      spinner.setAttribute('role', 'progressbar');
      host.appendChild(spinner);

      var i = 0;
      var timer = setInterval(function () {
        if (i >= CHUNKS.length) {
          clearInterval(timer);
          spinner.remove();
          // Giao dien Google that dung icon role=button, khong co chu "Copy" hien thi.
          var copy = document.createElement('div');
          copy.setAttribute('role', 'button');
          copy.setAttribute('tabindex', '0');
          copy.setAttribute('aria-label', 'Copy text');
          copy.innerHTML = '<svg aria-hidden="true"><path d="M8 7h11v14H8z"></path></svg>';
          copy.addEventListener('click', function () {
            window.__copiedText = [
              '### Main similarities',
              '',
              'Both peoples share **Austronesian** ancestry.',
              '',
              '- Related language families',
              '- Island geography',
              '',
              'Read [this study](https://source.example.com/study).'
            ].join('\n');
          });
          host.appendChild(copy);
          return;
        }
        block.innerHTML += CHUNKS[i];
        i += 1;
      }, 200);
    });
  </script>
</body>
</html>
